name: Harness Python CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest --json-report --json-report-file=pytest-report.json

      - name: Check pytest report
        run: python scripts/check_pytest_report.py pytest-report.json

      - name: Check Python harness rules
        run: python scripts/check_python_rules.py src

      - name: Check Harness docs
        run: python scripts/check_harness_docs.py
