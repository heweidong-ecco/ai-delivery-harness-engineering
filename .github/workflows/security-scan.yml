name: Security Scan

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit
        # 去掉 `|| true`:原先 bandit 执行失败 → 没有报告 → 下面的硬检查被静默跳过
        # → 整步仍然绿。这正是"空壳门禁"的病理切片。
        run: bandit -r src -q -f json -o bandit-report.json

      - name: Bandit check
        run: |
          if [ ! -f bandit-report.json ]; then
            echo "::error::bandit 未产出报告 —— 检查没有真正执行,不得视为通过"
            exit 1
          fi
          python -c "
          import json, sys
          with open('bandit-report.json') as f:
              data = json.load(f)
          issues = data.get('results', [])
          high = [i for i in issues if i.get('issue_severity') == 'HIGH']
          if high:
              print(f'HIGH issues: {len(high)}')
              sys.exit(1)
          print(f'Bandit passed, issues: {len(issues)}')
          "

      - name: pip-audit
        run: pip-audit --strict

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30
