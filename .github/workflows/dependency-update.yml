name: Dependency Update

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit pip-review

      # 依赖审计**不在这里做**:本 workflow 的职责是「发现过期依赖并开 PR」,
      # 审计失败不应该阻断更新(有漏洞时反而更需要更新)。
      # 漏洞扫描是 security-scan.yml(每日)与 harness-ci.yml(每次 PR)的硬门职责,
      # 原先这里那句 `pip-audit --strict || true` 既拦不住、又给不出信号 —— 已删除。

      - name: Check outdated
        # 去掉 `|| true`:工具本身失败(pip-review 崩了/没装上)必须暴露,不能假装跑过。
        run: pip-review --local --auto

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/dependency-update
          commit-message: "chore: update dependencies"
          title: "chore: update dependencies"
          body: |
            自动依赖更新。

            检查项：
            - [ ] CI 通过
            - [ ] 无破坏性变更
            - [ ] CHANGELOG 更新
          labels: dependencies, chore
          delete-branch: true
