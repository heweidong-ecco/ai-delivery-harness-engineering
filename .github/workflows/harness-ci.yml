name: Harness CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest --json-report --json-report-file=pytest-report.json

      - name: Check pytest report
        run: python scripts/check_pytest_report.py pytest-report.json

      - name: Check Python harness rules
        run: python scripts/check_python_rules.py src

      - name: Check layers
        run: python scripts/check_layers.py src

      - name: Check complexity
        run: python scripts/check_complexity.py src

      - name: Check i18n
        run: python scripts/check_i18n.py src

      - name: Check secrets
        run: python scripts/check_secrets.py .

      - name: Check Harness docs
        run: python scripts/check_harness_docs.py

      - name: Validate schemas
        run: python scripts/validate_schemas.py

      - name: Bandit
        run: bandit -r src -q

      - name: pip-audit
        run: pip-audit --strict || true

  commit-message:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          for sha in $(git rev-list "$base..$head"); do
            git log -1 --format=%s "$sha" > /tmp/msg.txt
            python scripts/check_commit_msg.py /tmp/msg.txt
          done
