name: Harness CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest --json-report --json-report-file=pytest-report.json

      - name: Check pytest report
        run: python scripts/check_pytest_report.py pytest-report.json

      - name: Check Python harness rules
        run: python scripts/check_python_rules.py src

      - name: Check layers
        run: python scripts/check_layers.py src

      - name: Check complexity
        run: python scripts/check_complexity.py src

      - name: Check i18n
        run: python scripts/check_i18n.py src

      - name: Check secrets
        run: python scripts/check_secrets.py .

      - name: Check Harness docs
        run: python scripts/check_harness_docs.py

      - name: Check stage gates
        # 反外审 H5:阶段门原先不在任何链路里。这里对每个需求跑产出物门;
        # 骨架期没有 harness/changes/REQ-* 时如实说明,而不是静默跳过。
        run: |
          shopt -s nullglob
          reqs=(harness/changes/REQ-*)
          if [ ${#reqs[@]} -eq 0 ]; then
            echo "尚未创建 harness/changes/REQ-* 目录 —— 无需求可查(骨架期)"
          else
            for req in "${reqs[@]}"; do
              echo "== 阶段门: $req"
              bash scripts/check-gates.sh "$req"
            done
          fi

      - name: Validate schemas
        run: python scripts/validate_schemas.py

      - name: Bandit
        run: bandit -r src -q

      - name: pip-audit
        # 反外审 H11:原为 `pip-audit --strict || true`(CI 软),
        # 与 scripts/check_dependencies.py(硬 fail)语义矛盾 —— 统一为硬。
        run: pip-audit --strict

  commit-message:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          for sha in $(git rev-list "$base..$head"); do
            git log -1 --format=%s "$sha" > /tmp/msg.txt
            python scripts/check_commit_msg.py /tmp/msg.txt
          done
